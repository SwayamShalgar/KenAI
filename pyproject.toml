[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ken"
version = "0.1.0"
description = "Personal Linux AI Assistant — fast, modular, private"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "PyQt6>=6.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.3",
    "duckduckgo-search>=5.3.0",
    "psutil>=5.9.8",
    "pyperclip>=1.8.2",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "anyio>=4.3.0",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "edge-tts>=6.1.9",
    "pygame>=2.5.2",
    "faster-whisper>=1.0.1",
    "numpy>=1.26.4",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]
memory = [
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]

[project.scripts]
ken = "ken.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ken"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
